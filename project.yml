name: MinimalInstagram

options:
  bundleIdPrefix: com.srichandramouli
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"            # Swift 6 language mode → strict data-race safety
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic       # pick your personal team in Xcode → Signing on first device run

packages:
  IGCore:
    path: Packages/IGCore

targets:
  MinimalInstagram:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: IGCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srichandramouli.MinimalInstagram
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # SwiftLint scans the whole repo; the script sandbox would deny those reads

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint
          else
            echo "warning: SwiftLint not installed — run 'brew install swiftlint' to enable lint warnings"
          fi
